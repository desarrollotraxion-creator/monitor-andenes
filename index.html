<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAXIÓN - Monitor de Andenes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0d13;
            --card-bg: #141722;
            --card-border: #232838;
            --accent-yellow: #ffb703;
            --color-libre: #2e7d32;
            --color-ocupada: #d84315;
            --color-retirar: #0288d1;
            --color-servicio: #c62828;
            --color-deshabilitada: #212121;
            --text-main: #f0f2f5;
            --text-muted: #8c93a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            gap: 16px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 10px;
            color: var(--accent-yellow);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .header-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .ultimo-movimiento-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1b2030;
            border: 1px solid #2d354d;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .ultimo-movimiento-badge.pulse {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
            transform: scale(1.02);
        }

        .mov-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4caf50;
            display: inline-block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-toggle-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1b1f2e;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .btn-mode {
            background: #252b3d;
            border: 1px solid #3b4259;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mode:hover {
            border-color: var(--accent-yellow);
        }

        .btn-mode.active {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
        }

        .stats-bar {
            display: flex;
            gap: 10px;
        }

        .stat-box {
            background: #1b1f2e;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
            min-width: 70px;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #202638;
            color: #fff;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 14px rgba(255, 183, 3, 0.25);
        }

        .section-label {
            width: 100%;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-yellow);
            margin: 14px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .dock-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            padding: 8px;
            min-height: 145px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: default;
        }

        body.modo-editor-on .dock-card {
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        body.modo-editor-on .dock-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            border-color: var(--accent-yellow) !important;
        }

        .dock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 5px;
        }

        .dock-num {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
        }

        .dock-status-pill {
            font-size: 8px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            color: #fff;
            white-space: nowrap;
        }

        .dock-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            padding: 6px 0;
            justify-content: flex-start;
        }

        .dock-linea {
            font-weight: 700;
            color: #ffffff;
            font-size: 11px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-eco {
            font-size: 11px;
            color: var(--accent-yellow);
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-operador {
            font-size: 9.5px;
            color: #b0b7c9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-obs {
            font-size: 9px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 4px;
            font-size: 10px;
            min-height: 18px;
        }

        .dock-tipo {
            font-weight: 800;
            color: var(--accent-yellow);
            font-size: 9.5px;
        }

        .status-libre { background-color: var(--color-libre) !important; }
        .status-ocupada { background-color: var(--color-ocupada) !important; }
        .status-retirar { background-color: var(--color-retirar) !important; }
        .status-servicio { background-color: var(--color-servicio) !important; }
        .status-deshabilitada { background-color: var(--color-deshabilitada) !important; color: #888; }

        .card-libre { border-color: rgba(46, 125, 50, 0.5); }
        .card-ocupada { border-color: var(--color-ocupada); }
        .card-retirar { border-color: var(--color-retirar); }
        .card-servicio { border-color: var(--color-servicio); }
        .card-deshabilitada { border-color: #333333; background-color: #121212; opacity: 0.6; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 440px;
            max-width: 92vw;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            background: #1b1f2e;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-yellow);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div>
                <div class="logo-title">TRAXIÓN</div>
                <div class="logo-sub">VIDA EN MOVIMIENTO</div>
            </div>
        </div>

        <div class="header-center">
            <div class="header-title">Monitor de Andenes</div>
            <div id="ultimoMovimiento" class="ultimo-movimiento-badge">
                <span class="mov-dot" id="movDot"></span>
                <span id="movTexto">Esperando movimientos...</span>
            </div>
        </div>

        <div class="header-right">
            <div class="admin-toggle-box">
                <button id="btnModoEditor" class="btn-mode" onclick="toggleModoEditor()">
                    🔒 Activar Modo Editor
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="statTotal">46</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Libres</div>
                    <div class="stat-value" id="statLibres" style="color: #4caf50;">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">En Uso</div>
                    <div class="stat-value" id="statOcupados" style="color: #ff9800;">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Servicio</div>
                    <div class="stat-value" id="statServicio" style="color: #f44336;">0</div>
                </div>
            </div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabRoja" onclick="seleccionarBodega('ROJA')">
            🔴 Bodega Roja (46 Andenes Operativos)
        </button>
        <button class="tab-btn" id="tabNaranja" onclick="seleccionarBodega('NARANJA')">
            🟠 Bodega Naranja (30 Andenes)
        </button>
    </div>

    <div id="pantallaAndenes"></div>

    <!-- Modal para Contraseña de Modo Editor -->
    <div class="modal-overlay" id="modalPassword">
        <div class="modal-card" style="width: 340px;">
            <div class="modal-header">
                <div class="modal-title">Acceso a Edición</div>
                <button class="close-btn" onclick="cerrarModalPassword()">&times;</button>
            </div>
            <form id="formPassword" onsubmit="validarPasswordEditor(event)">
                <div class="form-group">
                    <label>Contraseña de Autorización</label>
                    <input type="password" id="inputPassEditor" class="form-control" placeholder="Ingresa contraseña" autofocus required>
                </div>
                <button type="submit" class="btn-submit">DESBLOQUEAR EDICIÓN</button>
            </form>
        </div>
    </div>

    <!-- Modal de Edición de Andén -->
    <div class="modal-overlay" id="modalEdit">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Editar Andén</div>
                <button class="close-btn" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formEdit">
                <div class="form-group">
                    <label>Estado Actual</label>
                    <select id="editEstado" class="form-control">
                        <option value="LIBRE">LIBRE</option>
                        <option value="OCUPADA">OCUPADA</option>
                        <option value="PARA RETIRAR">PARA RETIRAR</option>
                        <option value="FUERA DE SERVICIO">FUERA DE SERVICIO</option>
                        <option value="DESHABILITADA">DESHABILITADA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de Movimiento</label>
                    <select id="editTipoViaje" class="form-control">
                        <option value="N/A">N/A</option>
                        <option value="CARGA">CARGA</option>
                        <option value="DESCARGA">DESCARGA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Línea de Transporte</label>
                    <input type="text" id="editLinea" class="form-control" placeholder="Ej: CASTORES">
                </div>
                <div class="form-group">
                    <label>Número Económico</label>
                    <input type="text" id="editEconomico" class="form-control" placeholder="Ej: 55458">
                </div>
                <div class="form-group">
                    <label>Montacarguista</label>
                    <input type="text" id="editMontacarguista" class="form-control" placeholder="Nombre del operador">
                </div>
                <div class="form-group">
                    <label># Montacargas</label>
                    <input type="text" id="editNumeroMontacargas" class="form-control" placeholder="Ej: MC-02">
                </div>
                <div class="form-group">
                    <label>Observaciones / Comentarios</label>
                    <input type="text" id="editComentarios" class="form-control" placeholder="Detalles de carga / sellos">
                </div>
                <button type="submit" class="btn-submit">GUARDAR CAMBIOS EN FIREBASE</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-3LoDsFnCayc1nuri8Kof3l4UIkAsXgc",
            authDomain: "andenes-c5905.firebaseapp.com",
            databaseURL: "https://andenes-c5905-default-rtdb.firebaseio.com",
            projectId: "andenes-c5905",
            storageBucket: "andenes-c5905.firebasestorage.app",
            messagingSenderId: "149209651462",
            appId: "1:149209651462:android:0a3019b5e660cff7006687"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const BODEGAS = {
            ROJA: { 
                clave: "ROJA", 
                nombre: "Bodega Roja", 
                total: 46, 
                tieneLados: true,
                ladoB: [2, 4, 6, 8, 10, 14, 16, 18, 20, 22, 24, 32, 34, 36, 38, 40, 42, 44, 46, 48, 50, 52, 54],
                ladoA: [3, 5, 7, 9, 11, 13, 21, 23, 25, 29, 31, 33, 35, 37, 39, 41, 43, 45, 47, 49, 51, 53, 55]
            },
            NARANJA: { 
                clave: "NARANJA", 
                nombre: "Bodega Naranja", 
                total: 30, 
                tieneLados: false 
            }
        };

        let bodegaActual = BODEGAS.ROJA;
        let andenesMap = new Map();
        let currentAndenEdit = null;
        let primeraCarga = true;
        let modoEditorActivo = false;
        let rtdbRefActual = null;

        window.toggleModoEditor = function() {
            if (modoEditorActivo) {
                modoEditorActivo = false;
                document.body.classList.remove('modo-editor-on');
                const btn = document.getElementById('btnModoEditor');
                btn.classList.remove('active');
                btn.innerHTML = '🔒 Activar Modo Editor';
            } else {
                document.getElementById('inputPassEditor').value = '';
                document.getElementById('modalPassword').classList.add('active');
            }
        };

        window.cerrarModalPassword = function() {
            document.getElementById('modalPassword').classList.remove('active');
        };

        window.validarPasswordEditor = function(e) {
            e.preventDefault();
            const pass = document.getElementById('inputPassEditor').value;
            if (pass === "DesarrolloSHE" || pass.toLowerCase() === "roja" || pass.toLowerCase() === "naranja") {
                modoEditorActivo = true;
                document.body.classList.add('modo-editor-on');
                const btn = document.getElementById('btnModoEditor');
                btn.classList.add('active');
                btn.innerHTML = '✏️ Modo Editor Activo (Salir)';
                cerrarModalPassword();
            } else {
                alert("Contraseña de administrador incorrecta");
            }
        };

        window.seleccionarBodega = function(clave) {
            bodegaActual = BODEGAS[clave];
            primeraCarga = true;
            document.getElementById('tabRoja').classList.toggle('active', clave === 'ROJA');
            document.getElementById('tabNaranja').classList.toggle('active', clave === 'NARANJA');
            conectarRealtimeDB();
        };

        function conectarRealtimeDB() {
            if (rtdbRefActual) {
                off(rtdbRefActual);
            }

            rtdbRefActual = ref(db, `bodegas/${bodegaActual.clave}/andenes`);

            onValue(rtdbRefActual, (snapshot) => {
                andenesMap.clear();

                if (snapshot.exists()) {
                    snapshot.forEach(childSnap => {
                        const data = childSnap.val();
                        if (data) {
                            const numKey = childSnap.key;
                            const num = parseInt(data.numero || data.numeroCelda || numKey);

                            if (!isNaN(num)) {
                                const anterior = andenesMap.get(num);
                                if (!primeraCarga && anterior && anterior.estado !== data.estado) {
                                    registrarUltimoMovimiento(num, data);
                                }
                                andenesMap.set(num, data);
                            }
                        }
                    });
                }

                if (primeraCarga) {
                    primeraCarga = false;
                }

                renderGrid();
            }, (error) => {
                console.error("Error Realtime DB:", error);
            });
        }

        function registrarUltimoMovimiento(num, data) {
            const badge = document.getElementById('ultimoMovimiento');
            const dot = document.getElementById('movDot');
            const texto = document.getElementById('movTexto');

            const estado = (data.estado || "ACTUALIZADO").toUpperCase();
            const eco = data.economico ? `(Eco: ${data.economico})` : '';
            const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (estado === "LIBRE") {
                dot.style.backgroundColor = "#2e7d32";
            } else if (estado === "OCUPADA" || estado === "OCUPADO") {
                dot.style.backgroundColor = "#d84315";
            } else if (estado === "PARA RETIRAR") {
                dot.style.backgroundColor = "#0288d1";
            } else {
                dot.style.backgroundColor = "#c62828";
            }

            texto.innerHTML = `<strong>Último:</strong> Andén ${num} pasó a <strong>${estado}</strong> ${eco} • <span style="color: #94a3b8;">${hora}</span>`;

            badge.classList.remove('pulse');
            void badge.offsetWidth;
            badge.classList.add('pulse');
        }

        function renderGrid() {
            const container = document.getElementById('pantallaAndenes');
            container.innerHTML = "";

            let countTotal = bodegaActual.total;
            let countLibres = 0;
            let countOcupados = 0;
            let countServicio = 0;

            let listaAndenesActivos = [];

            if (bodegaActual.tieneLados) {
                listaAndenesActivos = [...bodegaActual.ladoB, ...bodegaActual.ladoA];

                // LADO B
                const labelB = document.createElement('div');
                labelB.className = 'section-label';
                labelB.innerHTML = `LADO B (PAR) • ${bodegaActual.ladoB.length} ANDENES OPERATIVOS`;
                container.appendChild(labelB);

                const gridB = document.createElement('div');
                gridB.className = 'grid-container';
                bodegaActual.ladoB.forEach(num => gridB.appendChild(createCard(num)));
                container.appendChild(gridB);

                // LADO A
                const labelA = document.createElement('div');
                labelA.className = 'section-label';
                labelA.innerHTML = `LADO A (IMPAR) • ${bodegaActual.ladoA.length} ANDENES OPERATIVOS`;
                container.appendChild(labelA);

                const gridA = document.createElement('div');
                gridA.className = 'grid-container';
                bodegaActual.ladoA.forEach(num => gridA.appendChild(createCard(num)));
                container.appendChild(gridA);
            } else {
                for (let i = 1; i <= 30; i++) listaAndenesActivos.push(i);

                const grid = document.createElement('div');
                grid.className = 'grid-container';
                for (let i = 1; i <= 30; i++) {
                    grid.appendChild(createCard(i));
                }
                container.appendChild(grid);
            }

            listaAndenesActivos.forEach(num => {
                const data = andenesMap.get(num) || { estado: 'LIBRE' };
                const st = (data.estado || 'LIBRE').toUpperCase();
                if (st === 'LIBRE') {
                    countLibres++;
                } else if (st === 'FUERA DE SERVICIO' || st === 'DESHABILITADA' || st === 'DESHABILITADO') {
                    countServicio++;
                } else {
                    countOcupados++;
                }
            });

            document.getElementById('statTotal').innerText = countTotal;
            document.getElementById('statLibres').innerText = countLibres;
            document.getElementById('statOcupados').innerText = countOcupados;
            document.getElementById('statServicio').innerText = countServicio;
        }

        function createCard(num) {
            const data = andenesMap.get(num) || {
                numero: num.toString(),
                estado: "LIBRE",
                linea: "",
                economico: "",
                tipoViaje: "",
                comentarios: "",
                montacarguista: ""
            };

            const estado = (data.estado || "LIBRE").toUpperCase();
            const esLibre = (estado === "LIBRE");

            const linea = esLibre ? "" : (data.linea || "");
            const economico = esLibre ? "" : (data.economico || "");
            const montacarguista = esLibre ? "" : (data.montacarguista || "");
            const comentarios = esLibre ? "" : (data.comentarios || "");
            const tipoViaje = esLibre ? "" : (data.tipoViaje || "");

            let statusClass = "status-libre";
            let cardClass = "card-libre";

            if (estado === "OCUPADA" || estado === "OCUPADO") {
                statusClass = "status-ocupada";
                cardClass = "card-ocupada";
            } else if (estado === "PARA RETIRAR") {
                statusClass = "status-retirar";
                cardClass = "card-retirar";
            } else if (estado === "FUERA DE SERVICIO") {
                statusClass = "status-servicio";
                cardClass = "card-servicio";
            } else if (estado === "DESHABILITADA" || estado === "DESHABILITADO") {
                statusClass = "status-deshabilitada";
                cardClass = "card-deshabilitada";
            }

            const card = document.createElement('div');
            card.className = `dock-card ${cardClass}`;
            
            card.onclick = () => {
                if (modoEditorActivo) {
                    abrirModal(num, data);
                }
            };

            card.innerHTML = `
                <div class="dock-header">
                    <div class="dock-num">Andén ${num}</div>
                    <div class="dock-status-pill ${statusClass}">${estado}</div>
                </div>
                <div class="dock-body">
                    ${linea ? `<div class="dock-linea" title="${linea}">🚛 ${linea}</div>` : ''}
                    ${economico ? `<div class="dock-eco">🆔 ${economico}</div>` : ''}
                    ${montacarguista ? `<div class="dock-operador" title="${montacarguista}">🚜 ${montacarguista}</div>` : ''}
                    ${comentarios ? `<div class="dock-obs" title="${comentarios}">${comentarios}</div>` : ''}
                </div>
                <div class="dock-footer">
                    <div class="dock-tipo">${tipoViaje && tipoViaje !== 'N/A' ? tipoViaje : ''}</div>
                </div>
            `;

            return card;
        }

        function abrirModal(num, data) {
            currentAndenEdit = num;
            const esLibre = (data.estado || "LIBRE").toUpperCase() === "LIBRE";

            document.getElementById('modalTitle').innerText = `Editar Andén ${num} (${bodegaActual.nombre})`;
            document.getElementById('editEstado').value = (data.estado || "LIBRE").toUpperCase();
            document.getElementById('editTipoViaje').value = esLibre ? "N/A" : (data.tipoViaje || "N/A").toUpperCase();
            document.getElementById('editLinea').value = esLibre ? "" : (data.linea || "");
            document.getElementById('editEconomico').value = esLibre ? "" : (data.economico || "");
            document.getElementById('editMontacarguista').value = esLibre ? "" : (data.montacarguista || "");
            document.getElementById('editNumeroMontacargas').value = esLibre ? "" : (data.numeroMontacargas || "");
            document.getElementById('editComentarios').value = esLibre ? "" : (data.comentarios || "");
            document.getElementById('modalEdit').classList.add('active');
        }

        window.cerrarModal = function() {
            document.getElementById('modalEdit').classList.remove('active');
        };

        document.getElementById('formEdit').onsubmit = async function(e) {
            e.preventDefault();
            if (!modoEditorActivo) return;

            const numStr = currentAndenEdit.toString();
            const nuevoEstado = document.getElementById('editEstado').value;
            const esLibre = (nuevoEstado === "LIBRE");

            const updatedData = {
                id: numStr,
                numero: numStr,
                estado: nuevoEstado,
                tipoViaje: esLibre ? "N/A" : document.getElementById('editTipoViaje').value,
                linea: esLibre ? "" : document.getElementById('editLinea').value.trim(),
                economico: esLibre ? "" : document.getElementById('editEconomico').value.trim(),
                montacarguista: esLibre ? "" : document.getElementById('editMontacarguista').value.trim(),
                numeroMontacargas: esLibre ? "" : document.getElementById('editNumeroMontacargas').value.trim(),
                comentarios: esLibre ? "" : document.getElementById('editComentarios').value.trim()
            };

            try {
                await set(ref(db, `bodegas/${bodegaActual.clave}/andenes/${numStr}`), updatedData);
                cerrarModal();
            } catch (err) {
                alert("Error al guardar en Realtime Database: " + err.message);
            }
        };

        conectarRealtimeDB();
    </script>
</body>
</html>
